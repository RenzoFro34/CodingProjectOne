<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<h1>User Submission Form</h1>
<body>
    <form id="form">
<p>Username</p> 
 <input type="text" id="username" data-tooltip="Pick the username of your dreams"> <br>
 <p>Email</p>
 <input type="text" id="email" data-tooltip="Enter your email address"> <br>
 <p>Feedback and Suggestions</p>
 <textarea id="feedback" placeholder="Type Into Me" data-tooltip="What can we do better?"></textarea> <p>Character count - <span id="count">0</span> </p>
 <button id="submit-btn">Submit Form</button>
    </form>
    <div id="feedback-display"></div>
    <script src="cp1.js"></script>
